{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Awareness" %} — Patiya RedPulse{% endblock %}

{% block content %}
<h4 class="mb-4"><i class="fas fa-book-open"></i> {% trans "Awareness" %}</h4>

<div class="row">
    {% for article in articles %}
        <div class="col-md-4 mb-4">
            <div class="card article-card h-100 reveal">
                <div class="card-body d-flex flex-column">
                    <h5>{{ article.title }}</h5>
                    <p class="text-muted flex-grow-1">{{ article.summary }}</p>
                    <a href="{% url 'awareness_detail' article.slug %}" class="btn btn-outline-primary mt-2">
                        {% trans "Read More" %} <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
