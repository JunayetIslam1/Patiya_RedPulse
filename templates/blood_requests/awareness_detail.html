{% extends 'base.html' %}
{% load i18n %}

{% block title %}{{ article.title }} — Patiya RedPulse{% endblock %}

{% block content %}
<div class="card reveal">
    <div class="card-header">
        <h4 class="mb-0">{{ article.title }}</h4>
    </div>
    <div class="card-body">
        {% for para in article.body %}
            <p>{{ para|linebreaksbr }}</p>
        {% endfor %}
        <a href="{% url 'awareness_list' %}" class="btn btn-outline-secondary mt-2">
            <i class="fas fa-arrow-left"></i> {% trans "Back to Awareness" %}
        </a>
    </div>
</div>
{% endblock %}
