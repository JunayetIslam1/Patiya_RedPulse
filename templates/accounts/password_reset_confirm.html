{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Set New Password" %} — Patiya RedPulse{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card reveal">
            <div class="card-header">
                <h4 class="mb-0"><i class="fas fa-lock-open"></i> {% trans "Set New Password" %}</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">{% trans "Change Password" %}</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
